fields:
  bb: "block mapping (course identity page) — term_id (term machine id, e.g. _426_1) / course_id (course machine id, e.g. _18030_1) / term_status (active|frozen — derived from inbox terms and written to the page, eliminating the single dependency point); one-to-one with the territory directory, i.e. the identity proof"
  terms: "block mapping (domain-root digest page) — term directory name → one sentence (active/frozen flag + term_id); the active term is the default scope for pulling and digesting"
inject: "Course operations subdomain (inside the cuhksz domain) `wiki/cuhksz/bb/` (external territory bb.cuhk.edu.cn, connector bb-cli purely read-only, usage and location in the bbcli skill): two-sided same-structure `<term>/<course>/` — outer `cuhksz/bb/` course workspace (machine-pulled artifacts: documents fully materialized, media pointer-based by default, submissions in submissions/, append-only; notes preservation subzone notes/ — home of study notes, human-owned with ai artifacts coexisting (teach explanations deposit flat ai notes marked origin: ai, quiz papers live in the testing/ subzone; ai artifacts append-only, never overwritten; deletion and editing are human freedom — fetch/reconciliation/mapping never touch human notes, reading is legitimate)), inner `wiki/cuhksz/bb/` territory, directory names = term name/course code (e.g. 2610UG/AIE3005); machine ids and term status land in the identity page's bb block mapping (term_id/course_id/term_status) as a one-to-one identity proof, same-term same-code disambiguated by suffix, deactivated courses marked status: deprecated, never deleted; domain-root digest page inbox.md (recent-window announcement distillation + upcoming deadlines + dual-source unsubmitted-assignment reminders — assignment without submission ∪ gradebook column with due but no attempt, rows tagged with course, whole page regenerable with short TTL, **created when absent**; frontmatter doubles as domain config — terms block mapping of active terms and frozen flags); announcements are triaged, not archived (assignment changes → assessments, exams/policies/grouping → info, action items → todo, resource releases → fetch then discard, originals pull-fresh on demand); courseware, once materialized, is a local terminal asset exempt from TTL; projection details in the bb-map plugin; map-first workflow — every course task (teach/quiz/track/review/Q&A) runs only after the course is fully mapped (bb-map) and bases directly on the mapped territory (sm-N/info/assessments/user), never on raw source files or ad-hoc reading; credentials and sessions stay on the local machine, never in the repository; course/grade/submission data is instance data, never entering the framework repository; trust ceiling machine-confirmed, stale_after = pull date + TTL (default 1 day, overridable on the digest page; date granularity, expiry judged against the current day), the agent is the synchronizer"
inject_tier: member
usage:
  - Map-first: enter the domain by first ensuring the target course is fully mapped via bb-map (info/courseware/assessments/attachments) and reading wiki/cuhksz/bb/inbox.md (digest and domain config in one; created when absent — triggered by the bb-map command anchor or agent initiative); refresh flow = fresh-pull announcements + dues → distill and rewrite the digest (dual-source unsubmitted reminders: assignments without submission ∪ grades with due but no attempt) → sort announcements into derivations → log line (type other); staleness follows the same flow (the agent is the synchronizer)
  - Pull and placement: courseware → cuhksz/bb/<term>/<course>/ (source-side directory tree preserved); submissions → cuhksz/bb/<term>/<course>/submissions/; pulled artifacts append-only, never overwritten; changed files with the same name re-pulled via --refresh and landed as new files with a content-hash suffix (old files kept = revision history); the notes zone notes/ is a two-regime coexistence: the machine never writes/deletes/renames human notes (reading and analysis are legitimate — fodder for cognition consumption); ai artifacts (origin: ai — teach explanation notes / quiz papers) are placed through their collection channels, append-only, never overwritten; when fetch placement hits a reserved-name conflict, rename on landing and notify
  - New term/new course = create the territory directory + identity page (bb block mapping term_id/course_id); bbcli resolution uses directory names directly (--term term name, course-code substring)
  - Materialization layering: documents in full; media (video/audio) pointer-based by default, not landed in bb/ — fetch filter flags (--exclude-mime/--exclude-ext/--max-size) in the bbcli skill; unit-page lists register unmaterialized entries, single-fetch on demand via --match
  - Announcement triage: no archiving, no pages (truth lives on BB, pull-fresh on demand); assignment changes → assessments mechanical region, exams/rescheduling → info basic information (+ calendar derivation), policies/faculty/grouping → info basic information, action items → todo, resource releases → trigger fetch then discard, high-value long texts → notes emergence with backlinks
  - One-way derivation (out-only): action items → todo; course schedules → calendar; high-value conclusions → notes (backlinks to territory pages) — the todo/calendar/notes bridges, format details belong to the bridges
  - Privacy and boundaries: grades pulled on demand and presented only, no default projection; roster never pulled; write actions such as submitting assignments never enter this domain
checks:
  - Semantic items (v0.1 manual, attached audit deferred): a type: bb page outside wiki/cuhksz/bb/ → error; identity-page bb block mapping missing course_id or not matching the directory → error; manual-edit traces on the digest page → warning; stale list (info level)
