id: bb-track
version: 0.8
depends:
  - bb
  - bb-map
  - trust
  - wiki
commands:
  - bb-track
updated: 2026-10-07
attachment:
  - "wiki/cuhksz/bb/<term>/<course>/user.md — cognition profile (course root, outside the four buckets; two-region system: cognition readings converge-and-overwrite + evidence stream append-only)"
  - "cuhksz/bb/<term>/<course>/notes/ — study-notes zone (bb v0.7 coexistence: human notes + ai notes + testing/ papers; consumed by this plugin — human-note attributes, ai notes as weak evidence, paper grading as machine evidence)"
fields:
  origin: "scalar (optional on bb-side note files) — human|ai authorship; ai is weak evidence, human review promotes its weight"
  form: "scalar (optional on bb-side note files) — text|image|mixed form"
  stage: "scalar (optional on bb-side note files) — snapshot|mature|summary stage (ad-hoc snapshot/matured write-up/collected summary); the marking belongs to the human, changes are cognition signals"
inject: "bb cognition profile (map-first — cognition reads/writes run only after the course is fully mapped via bb-map): per-course user.md at the course root (the first domain-native territory page, wiki v0.7's two forms) — `## Cognition Readings` converge-and-overwrite (anchored on courseware sm-N, coarse-grained self-assessment allowed, status words open; includes the goal layer: course goal + time-scoped short-term priorities) + `## Evidence Stream` append-only (date + source + assertion + backlink); signal weights human>machine>ai notes (weak evidence, human review promotes); what-should-be-known is not stored (gaps computed on the fly), question-level wrong answers go to assessments review, statistics computed on the fly; two-track updates (agent-spontaneous on significant signals / user-explicit), lazy profile creation; collection channels (bb v0.7 coexistence) — teach's significant Q&A deposited as notes/ ai notes (weak evidence), quiz's self-test grading landed in notes/testing/ (machine evidence), entering the stream requires agent-triggered confirmation (proactively asked at teaching key points), usage projections hang off the bb-track command; the term is the boundary, freezing with term_status; trust ceiling machine-confirmed (human evidence promotes to human-reviewed), stale_after default 14 days, overridable; the notes zone notes/ is read-only, optional attributes origin/form/stage (stage markings belong to the human); cognition registered via the user-profile bridge — at profile creation, if the profile page is present, maintain one line in its `## Domain Cognition` section (bb + path form); if absent, skip, never create on its behalf"
usage:
  - "Map-first: ensure the course is fully mapped (bb-map) before any cognition read/write; the profile anchors directly on the mapped sm-N + evidence, never on raw source or ad-hoc reading"
  - "Profile creation: create user.md on the first significant signal or user instruction (type: bb + generated/updated/stale_after); absence simply means no cognition data — the consumption side degrades gracefully without erroring"
  - "Append evidence: `- MM-DD source (human conversation|machine grades|human note|ai note|human review): assertion → [[backlink]]`; the source vocabulary is open"
  - "Converge readings: new evidence arrives → rewrite the reading line (the new value replaces the old, the line keeps a recent evidence digest and date); the evidence stream is untouched"
  - "Consumption discipline: before teaching/testing/review-type output, read user.md first; when stale, first verify against recent-window evidence or ask; before verification consume at the conservative tier (states downgraded half a tier); gap analysis = courseware's full knowledge-point set − the anchored set, computed on the fly"
  - "Notes consumption: read the notes/ overview and stage/origin attributes as signals; never modify, delete, or mark stage on their behalf; ai notes are weak evidence only"
  - "Collection channels (bb-teach / bb-quiz, usage projections hang off the bb-track command injection region): explanation deposits = notes/ ai notes (origin: ai, weak evidence); self-test grading = notes/testing/ papers (machine evidence, source marked machine self-test) — both enter the evidence stream after agent-triggered confirmation (the agent proactively asks at teaching key points whether/what-form to record, not passively waiting) and adjust readings per the convergence discipline"
  - "Post-write pipeline: verify; log line (type profile, --domain bb)"
  - "Cognition-bridge registration (user-profile on-demand bridge): at profile creation, if the profile page is present, maintain one line in its `## Domain Cognition` section: `- bb: wiki/cuhksz/bb/<term>/<course>/user.md` (path form wildcarding multiple courses and profiles); if the profile is absent, skip, never create on its behalf (on-demand bridges tolerate absence)"
checks:
  - "Semantic items (v0.1 manual, attached audit deferred): user.md outside the course root or inside the four buckets → error; an evidence-stream entry rewritten or deleted → error; a reading entry without traceable evidence → warning; a reading based only on origin: ai without review → warning; consuming stale beyond the window without verification → info; note attribute values outside the open vocabulary → info"
