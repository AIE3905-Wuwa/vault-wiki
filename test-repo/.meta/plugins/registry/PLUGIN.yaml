attachment:
  - "cuhksz/registry/ — academic regulations materialization zone (public PDFs of registry.cuhk.edu.cn materialized append-only; public institutional documents, not personal assets)"
  - "wiki/cuhksz/registry/ — regulations territory: schemes.md (university-wide curriculum scheme index — college → major → scheme page pointers, human-machine co-maintained) + <scheme-name>.md (proxy pages: raw pointers + key-point distillation + version cross-checking)"
fields:
  registry: "block mapping (index/proxy pages) — source (official page URL) / edition (version anchor: admission-cohort batch + document/Senate number, e.g. AB2025_C037) / raw_file / raw_sha256"
inject: "Academic regulations subdomain (external source registry.cuhk.edu.cn, the Registry's official site, **no connector** — manual downloads after explicit user instruction, semi-automatic materialization): materialization zone `cuhksz/registry/` (official-site PDFs append-only, version batches advance, never overwritten) + territory `wiki/cuhksz/registry/` — the index page schemes.md (university-wide college → major → scheme page URL pointers; page-creation sources: the undergraduate major list registry.cuhk.edu.cn/page/20 and the undergraduate handbook /page/22 family, covering double majors/joint programmes/minors; human-machine co-maintained, public-institution navigation) and proxy pages (raw_file/raw_sha256 + key-point distillation append-only + version cross-check records); **cross-check cadence** = manual verification at semester start and on Senate document days (pages carry no dates, spot-check by PDF Last-Modified); institutional cross-checking is dual-source — this zone's rule PDFs are the institutional source, the sis-cli Degree Progress Report (DPR) the dynamic source, cross-check conclusions emerging into notes with backlinks; trust human-reviewed (manual verification) + version anchors, no TTL (institutional change is caught by cross-checking, not by expiry); discontinued majors (e.g. Electronic Information Engineering 2015-2021) honestly annotated, never deleted"
inject_tier: member
usage:
  - Index page creation/maintenance: from the registry.cuhk.edu.cn undergraduate major list (/page/20 Chinese, /en/page/20 English), list majors per college (Chinese-English names + years offered) with scheme page URLs; additions and removals honestly annotated as majors are introduced or discontinued
  - Materialization: PDFs specified by the user or discovered during cross-checking are downloaded to cuhksz/registry/<original-name>.pdf (download after explicit user instruction) + a proxy page is created (registry block mapping source/edition/raw_file/raw_sha256 + key-point distillation)
  - Version cross-checking: when a new academic-year batch of PDFs goes live (the official site's 2026-08/09 directory-batch pattern) → update the index page's pointers, keep the old proxy pages (append-only, never overwritten)
  - Curriculum scheme cross-checking: when the user asks 'what courses are still missing / can I graduate' — DPR computed on the fly (sis-cli) as primary, this zone's PDF rules as support; conclusions enter notes after confirmation, with backlinks
checks:
  - Semantic items (v0.1 manual, attached audit deferred): a proxy page missing raw_file/raw_sha256 → error; a broken index-page pointer URL on spot-check → warning; a materialization-zone file with no proxy page → warning
