id: bb-map
version: 0.19
depends:
  - bb
  - wiki
updated: 2026-10-08
attachment:
  - "wiki/cuhksz/bb/<term>/<course>/info.md — course information page doubling as identity page (bb block mapping term_id/course_id/term_status + distillation of syllabus course-policy key points (open vocabulary, info-N anchors) + notes accumulation)"
  - "wiki/cuhksz/bb/<term>/<course>/courseware/ — knowledge-point pages (one per content unit: knowledge-point summary (sm-N anchors + section hints) + glossary + unit file list + raw_path pointer (may point to a directory or be absent); pure proxy, whole page regenerable)"
  - "wiki/cuhksz/bb/<term>/<course>/assessments/ — academic-affair aggregate pages (one per assignment/exam, summary columns excluded, four elements: requirements/references distillation (req-N/ref-N anchors) + submission/results mechanical snapshots, an absent due raises no alert)"
  - "wiki/cuhksz/bb/<term>/<course>/attachments/ — attachment 1:1 proxies (flat, raw_file/raw_sha256)"
commands:
  - bb-map
fields:
  raw_path: "scalar (courseware knowledge-point page) — root-relative path pointing at a bb/ content unit (file or directory); the path is the birth certificate; may be absent for entirely undownloaded units (the list marking it undownloaded is itself the record)"
  assessment: "block mapping (assessments aggregate-page mechanical region) — due (deadline) / submitted_at (submission time) / score and possible (score/full marks) / status (Graded|NeedsGrading|None) / column_id and attempt_id (gradebook column and submission-record ids, reconciliation anchors) — API snapshot fields"
  raw: "block mapping (assessments aggregate-page multi-source reconciliation) — role → bb/ relative path (requirement/reference/submission, open vocabulary), the correspondence between the aggregate page and the bb/ file group; multiple pages may reference the same file (a shared requirement file is a normal shape)"
  raw_file: "scalar (attachments 1:1 proxy page) — root-relative path pointing at the bb/ original (word-form and semantics same as mapping)"
  raw_sha256: "scalar (attachments 1:1 proxy page) — hexadecimal SHA-256, mechanically recomputable from bb/"
inject: "bb mapping rules: the territory wiki/cuhksz/bb/<term>/<course>/ canonical four buckets (bb/ keeps the source shape, bucket names final-ruled in v0.4: courseware/assessments/attachments; the course root also holds user.md, the cognition profile — a bb-track domain-native page not bound by the four buckets) — info.md course information page doubling as identity page (bb block mapping term_id/course_id/term_status + distillation of syllabus course-policy key points (open vocabulary: grading/assessment/faculty/TA/grouping/teaching language/AI policy, info-N anchors, missing items marked 'not provided') + notes accumulation; it holds 'what happens when', all elements of graded affairs go to assessments); courseware/ knowledge-point pages, one per content unit (unit = a bb/ directory 'handouts + attached files as one' or a flat single file; parallel same-kind directories merge into one page; knowledge-point summary (sm-N anchors — each distinct concept one anchor, never lumped — + one-line gist + section hints) + glossary + unit file list (the list is the correspondence) + raw_path pointer (may be absent for undownloaded units); pure proxy); assessments/ aggregate pages, one per assignment/exam (summary columns Weighted Total/Total excluded; four elements: requirements/references distillation (req-N/ref-N anchors)/submission/results mechanical snapshots, an absent due raises no alert, no-submission gets its own wording; assessment block mapping due/submitted_at/score/status/column_id + raw block mapping role → bb/ path + `## Review` accumulation append-only); attachments/ 1:1 flat proxies (raw_file/raw_sha256, pure proxy); placement criteria — has a gradebook column or a submission action → assessments/ (summary columns and section-registration columns excepted — a section-registration column = registration of sections/attendance that is not a knowledge assessment, e.g. Tutorial Section), teacher's non-handout assets → attachments/, content units → courseware/, structural facts go into info.md; handout/attachment boundary: week-following content → courseware, supporting resources → attachments; info and assessments are two-form partitioned (mechanical region regenerable-and-overwritten + accumulation region append-only, rebuilds must not touch them), courseware/attachments are pure proxies (precious content goes to notes); mapping never modifies the bb/ source side, never copies full original text, vanished sources marked deprecated, not deleted; API snapshot sections carry stale_after = pull date + TTL, local reconciliation proxies have no TTL; raw_path + sm-N are the citation anchors — derived content (notes/reviews/answers) cites the source through them"
usage:
  - Course information page: create info.md per course (type: bb + bb block mapping term_id/course_id/term_status (active|frozen) + generated/stale_after); the body's `## Basic Information` distills course-policy key points (grading/assessment/faculty/TA/grouping/teaching language/AI policy, itemized `<a id="info-N">` anchors, reading bb/ syllabi and assessment files, missing items marked 'not provided'); 'what happens when' is recorded here, all elements of graded affairs go to assessments pages
  - Knowledge-point pages: each bb/ content unit (directory = handouts + attached files as one, or a flat single file; parallel same-kind directories merge into one page) → courseware/<unit-name>.md (type: bb + raw_path pointing at that unit, may be absent for entirely undownloaded units + generated); read sources to identify knowledge points → `## Knowledge Point Summary` itemized `<a id="sm-N">` anchors + one-line gist + source-side section-level hints → `## Knowledge Point Links` cross-links between points → `## Terminology` English-Chinese glossary → `## Unit Files` two-state reconciliation list (present locally / unmaterialized pointer entries — media pointer-based by default, see the bb block; for flat multi-attachment units the list is the correspondence); whole page regenerable, precious content distilled into notes
  - "Knowledge-point granularity (fine, not coarse): each distinct concept / term = one sm-N anchor, format 'English term — one-line Chinese gist'; never lump multiple concepts into one anchor (e.g. 'axioms + random variables + Bayes' must be three anchors, not one); the sm-N count reflects 'every distinct concept', not 'a few themes'; sm-N is the citation currency of bb-teach / bb-track downstream, so granularity must be fine enough to serve them"
  - assessments page maintenance: gradebook-column-driven page creation (file name = sanitized original assignment name; summary columns Weighted Total/Total and section-registration columns — registration of sections/attendance that is not a knowledge assessment, e.g. Tutorial Section — excluded, no pages); `## Requirements`/`## References` distilled when sources exist (itemized `<a id="req-N">`/`<a id="ref-N">` anchors, sourceless marked 'no separate requirement file'); the raw block mapping registers requirement/reference/submission files (submissions live in cuhksz/bb/<term>/<course>/submissions/; multiple pages may reference the same file); `## Submission`/`## Results` mechanical regions refreshed from grades/submission snapshots (an absent due reserves an explanation slot and raises no alert; with no submission record use the dedicated wording listing three possibilities); always write a log line (type map) afterwards
  - attachments proxies: one page per teacher-released non-handout asset (raw_file/raw_sha256), flat; structural facts like TA/grouping get no attachment pages
  - Placement criteria (see the injection line)
  - Rebuild discipline: the mechanical region is reconciled and overwritten; the accumulation regions (info notes / assessments review) are append-only, rebuilds must not touch them; attachments proxies are whole-page regenerable
  - stale handling: assessments results and info basic information carry stale_after; when stale, refresh via a fresh bbcli pull (the agent is the synchronizer); courseware/attachments are purely local reconciliation, no TTL
  - Map-first prerequisite: bb-map is the prerequisite for all course tasks (teaching/quiz/review/Q&A) — run full-course mapping before any of them; the mapping is their single basis (sm-N/info/assessments), never raw source or ad-hoc reading — except the teaching-side unmapped-concept fallback (predict location → read raw → parse → propose mapping the concept back as a new sm-N, emergence-based)
  - Source citation: raw_path + sm-N are the citation anchors — derived content (notes/reviews/answers) cites its source (courseware/textbook) through them
  - Post-write pipeline (mechanical, automatic): python .meta/scripts/pipeline.py index + tags + hot + log + verify (rebuild the derived layer first, then validate — validation closes at the end, avoiding premature false drift reports from the derived zones)
  - Derivation out-only: action items → todo, high-value reviews → notes (backlinks to assessments pages) — the todo/notes bridges
checks:
  - Semantic items (v0.1 manual, attached audit deferred): a territory page outside the four buckets → error (except the course-root user.md — a bb-track domain-native page); a knowledge-point page's raw_path dangling → error (absence is legitimate — an undownloaded unit marked in the list is itself a record); info.md missing the bb block mapping (term_id/course_id/term_status) or not matching the directory → error; an attachments proxy's raw_file pointing at a nonexistent bb/ file → error; an assessments page missing the raw block mapping or column_id → warning; a page created for a summary column (Weighted Total/Total) → warning; a knowledge-point page missing `## Knowledge Point Summary` or summary items missing sm-N anchors → warning; a knowledge-point summary lumping multiple distinct concepts into one sm-N anchor → warning; a knowledge-point page missing `## Terminology` → info; an info distillation section missing course-policy key points → info; assessments having a requirement source but an undistilled requirements section → info; a vanished source file not marked deprecated → warning; an accumulation region (notes/review) rewritten by a rebuild → error; mapping completeness (a bb/ content unit with no corresponding page) → info
