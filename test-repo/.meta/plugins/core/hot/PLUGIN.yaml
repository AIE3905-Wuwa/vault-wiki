id: hot
schema_version: 1
version: 0.10
depends:
  - wiki
updated: 2026-10-06
attachment:
  - "wiki/hot.md — single-file hot cache"
fields: {}
inject: "Hot cache `wiki/hot.md`: recent-change digest (≤25 entries, <5 days, ≤200 chars per entry); agents read this page first on entering the repository; evict out-of-window entries before writing"
usage:
  - Writing entries (mechanical, automatic): `python .meta/scripts/pipeline.py hot <type> "<wikilink + one-sentence essence>"` (type value set same as log, see the log block of the AGENTS injection region); window eviction and truncation are performed by the script
checks:
  - Window out of bounds (>25 entries / >5 days / >200 chars per entry) → run `pipeline.py hot <type> "<backfill>"` once, or wait for the next write to converge naturally then re-check
  - Contradiction with log (log has records while hot shows no trace) → warning
